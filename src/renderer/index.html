<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CocaCode Dock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 32 32" width="22" height="22"><rect x="2" y="2" width="28" height="28" rx="7" fill="currentColor"/><circle cx="16" cy="16" r="7" fill="#fff"/></svg>
      <span>CocaCode Dock</span>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" class="search" placeholder="搜索程序、网址或路径…" />
    </div>
    <div class="views" id="viewSwitch">
      <button class="vbtn" data-view="96" title="大图标">96</button>
      <button class="vbtn active" data-view="48" title="中图标">48</button>
      <button class="vbtn" data-view="32" title="小图标">32</button>
      <button class="vbtn" data-view="16" title="很小">16</button>
      <button class="vbtn" data-view="list" title="列表">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-add" title="添加">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn" id="btn-scan" title="扫描本机">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7v4a1 1 0 0 0 1 1h3m0-5v6m0-6 4-3 5 3 4-3v10l-4 3-5-3-4 3V7Z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8 18.68l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.32 8l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51H15a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <button class="icon-btn" id="btn-import" title="导入备份">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="icon-btn" id="btn-export" title="导出备份">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="btn-hide" title="最小化到托盘">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="ctxMenu" class="ctx-menu hidden"></div>

  <!-- 编辑/添加弹窗 -->
  <div id="editModal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="editTitle">添加</h3>
        <button class="sheet-close" id="editClose" type="button" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="field">
        <label for="f-name">名称 <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="例如：Photoshop" />
      </div>
      <div class="field">
        <label for="f-kind">类型</label>
        <select id="f-kind">
          <option value="app">本地程序</option>
          <option value="url">网址收藏</option>
          <option value="cmd">CMD 命令</option>
        </select>
      </div>
      <div class="field" id="f-cat-field">
        <label for="f-cat">分类</label>
        <select id="f-cat"></select>
      </div>
      <div class="field">
        <label for="f-target" id="f-target-label">目标路径 <span class="req">*</span></label>
        <div class="path-group">
          <input type="text" id="f-target" placeholder="C:\...\app.exe" />
          <button class="pbtn ghost" id="btn-browse" type="button">浏览</button>
        </div>
        <div class="hint" id="f-target-hint">可粘贴路径，或点“浏览”选择本机程序。</div>
      </div>
      <div class="field" id="f-source-field">
        <label for="f-source">本地源文件路径 <span class="hint-inline">（可选）</span></label>
        <input type="text" id="f-source" placeholder="原始安装包或源文件路径" />
        <div class="hint">右键“打开本地源文件”会打开此路径。</div>
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" id="f-fav" /> 加入常用</label>
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" id="f-customicon" /> 使用自定义图标</label>
        <div class="hint">建议尺寸 48×48 像素，支持 png / jpg / ico / svg。</div>
        <div id="f-icon-preview-field" style="display:none; margin-top:10px;">
          <div class="icon-preview" id="iconPreview"></div>
          <button class="pbtn ghost" id="btn-pickicon" type="button" style="margin-top:8px;">选择图片</button>
        </div>
      </div>
      <div class="foot">
        <button class="pbtn ghost" id="editCancel">取消</button>
        <button class="pbtn" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 扫描弹窗 -->
  <div id="scanModal" class="modal hidden">
    <div class="sheet wide">
      <h3>扫描本机程序</h3>
      <p class="sub">已自动按规则分类，可勾选并调整分组后添加；不需要的取消勾选即可。</p>
      <div class="scan-list" id="scanList"></div>
      <div class="foot">
        <button class="pbtn ghost" id="scanCancel">取消</button>
        <button class="pbtn" id="scanAdd">添加选中</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden">
    <div class="sheet">
      <h3>设置</h3>
      <div class="field">
        <label for="s-accent">主题色</label>
        <input type="color" id="s-accent" value="#0071e3" />
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" id="s-autoscan" /> 首次启动自动扫描本机程序</label>
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" id="s-autostart" /> 开机启动</label>
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" id="s-ontop" /> 窗口置顶</label>
      </div>
      <div class="field">
        <label for="s-hotkey">全局快捷键</label>
        <input type="text" id="s-hotkey" placeholder="例如 Alt+Space" />
        <div class="hint">留空表示不启用全局快捷键。</div>
      </div>
      <div class="foot">
        <button class="pbtn ghost" id="settingsCancel">取消</button>
        <button class="pbtn" id="settingsSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 分组管理弹窗 -->
  <div id="catModal" class="modal hidden">
    <div class="sheet">
      <h3>分组管理</h3>
      <p class="sub">可添加、重命名、删除分组，或用 ↑ ↓ 调整顺序。系统分组「常用」「收藏夹」不可修改。</p>
      <div class="cat-list" id="catList"></div>
      <button class="pbtn ghost block" id="catAdd" type="button">+ 添加分组</button>
      <div class="foot">
        <button class="pbtn ghost" id="catCancel">取消</button>
        <button class="pbtn" id="catSave">保存</button>
      </div>
    </div>
  </div>
  <!-- 删除分组确认弹窗 -->
  <div id="catDelModal" class="modal hidden">
    <div class="sheet small">
      <h3>删除分组</h3>
      <p class="msg-text">将「<b id="catDelName"></b>」中的项目移动到：</p>
      <div class="field">
        <select id="catDelSelect"></select>
      </div>
      <div class="foot">
        <button class="pbtn ghost" id="catDelCancel">取消</button>
        <button class="pbtn" id="catDelOk">确定删除</button>
      </div>
    </div>
  </div>
  <!-- 消息弹窗 -->
  <div id="msgModal" class="modal hidden">
    <div class="sheet small">
      <h3 id="msgTitle">提示</h3>
      <p class="msg-text" id="msgText"></p>
      <div class="foot"><button class="pbtn" id="msgOk">确定</button></div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="confirmModal" class="modal hidden">
    <div class="sheet small">
      <h3 id="confirmTitle">确认</h3>
      <p class="msg-text" id="confirmText"></p>
      <div class="foot">
        <button class="pbtn ghost" id="confirmCancel">取消</button>
        <button class="pbtn" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
